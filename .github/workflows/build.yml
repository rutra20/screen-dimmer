name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with the built-in C# compiler
        shell: cmd
        run: build.cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenDimmer
          path: dist/ScreenDimmer.exe
          if-no-files-found: error

      - name: Attach the exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ScreenDimmer.exe

  # Cross-platform compile check: compiles the same source on Linux against the
  # .NET Framework reference assemblies, so syntax/API errors fail fast on every
  # push instead of only being caught by the Windows build.
  compile-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile against the .NET Framework reference assemblies
        run: dotnet build src/ScreenDimmer.CompileCheck.csproj --nologo -warnaserror
